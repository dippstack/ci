name: "explain-failure"
description: "Причина ошибки выкатки словами: хвост журнала хоста и заголовок PR → claude -p со скиллом humanize на раннере, похожий случай из брейна проекта. Нет модели — пусто, шлюз показывает техническую причину и хвост (dippstack/ais#784)."
inputs:
  title:        { description: "заголовок PR/коммита", required: true }
  reason:       { description: "техническая причина из шлюза, одна строка", required: true }
  tail-file:    { description: "файл с хвостом журнала хоста (может не существовать)", default: "" }
  brain-source: { description: "GBRAIN_SOURCE проекта (yan | ais | marketplace); пусто = без брейна", default: "" }
  timeout:      { description: "секунд на ответ модели", default: "60" }
outputs:
  sentence:
    description: "одно предложение «что случилось»; пусто = модели не было"
    value: ${{ steps.run.outputs.sentence }}
  similar:
    description: "slug похожей страницы брейна; пусто = не нашлось"
    value: ${{ steps.run.outputs.similar }}
runs:
  using: "composite"
  steps:
    - id: run
      shell: bash
      env:
        EXPLAIN_TITLE: ${{ inputs.title }}
        EXPLAIN_REASON: ${{ inputs.reason }}
        EXPLAIN_TAIL: ${{ inputs.tail-file }}
        GBRAIN_SOURCE: ${{ inputs.brain-source }}
        EXPLAIN_TIMEOUT: ${{ inputs.timeout }}
      run: |
        out="$(bash "${{ github.action_path }}/explain.sh")" || out=""
        sentence="$(printf '%s\n' "$out" | sed -n 1p)"
        similar="$(printf '%s\n' "$out" | sed -n 's/^похожий случай: //p' | head -n 1)"
        [ -n "$sentence" ] && echo "модель: $sentence" || echo "модели нет — шлюз покажет техническую причину"
        [ -n "$similar" ] && echo "похожий случай: $similar"
        { echo "sentence=$sentence"; echo "similar=$similar"; } >> "$GITHUB_OUTPUT"
