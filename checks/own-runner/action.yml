name: "own-runner"
description: "Канон CI, правило 1: ни одного облачного раннера GitHub в workflow флота. Красит workflow вызывающей репы с ubuntu-*/macos-*/windows-*."
runs:
  using: "composite"
  steps:
    - name: облачных раннеров GitHub в workflow быть не должно
      shell: bash
      run: |
        set -uo pipefail
        dir=".github/workflows"
        if [ ! -d "$dir" ]; then echo "workflow нет — пропуск"; exit 0; fi
        # Комментарии срезаем: упоминание в пояснении — не раннер. Ловим и runs-on, и
        # матрицы os: [ubuntu-latest], и версии (ubuntu-24.04) — все они GitHub-hosted.
        bad=""
        for f in "$dir"/*.yml "$dir"/*.yaml; do
          [ -f "$f" ] || continue
          hits="$(sed -E 's/(^|[[:space:]])#.*$//' "$f" \
                  | grep -nE '(^|[^A-Za-z0-9_-])(ubuntu|macos|windows)-(latest|[0-9][0-9.]*)([^A-Za-z0-9_-]|$)' || true)"
          [ -n "$hits" ] && bad="${bad}${f}:"$'\n'"${hits}"$'\n'
        done
        if [ -n "$bad" ]; then
          echo "::error::облачный раннер GitHub в workflow — канон CI флота: только свои раннеры по меткам ([self-hosted, linux, home] / [self-hosted, macos, imac])"
          printf '%s' "$bad"
          exit 1
        fi
        echo "облачных раннеров нет: все workflow на своих метках"
