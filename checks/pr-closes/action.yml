name: "pr-closes"
description: "PR, который сделал задачу, обязан её закрыть словом, которое понимает GitHub. Краснеет на русском «Закрывает #N» и на ветке агентского слайса без ключевого слова."
runs:
  using: "composite"
  steps:
    # Тело PR читаем из СОБЫТИЯ, а не из чекаута: тело правят без коммита, и гейт обязан
    # видеть то, что в нём написано СЕЙЧАС. Через env, не подстановкой в текст команды:
    # тело PR пишет кто угодно, а подстановка чужого текста в шелл — это его исполнение.
    - name: ключевое слово, которое GitHub понимает
      shell: bash
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      run: |
        set -uo pipefail
        # Fail-closed на неверной проводке. Гейт, который позвали не на том событии, не имеет
        # тела PR и без этой проверки был бы вечно зелёным — тот самый «зелёный, который не
        # мог покраснеть». Лучше громко сломаться, чем молча ничего не проверять.
        if [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ]; then
          echo "::error::pr-closes зовётся только на событии pull_request, а пришло '${GITHUB_EVENT_NAME:-пусто}'"
          exit 1
        fi
        printf '%s' "$PR_BODY" > "${RUNNER_TEMP}/pr-body.txt"
        bash "$GITHUB_ACTION_PATH/pr-closes-guard.sh" \
          --body "${RUNNER_TEMP}/pr-body.txt" --branch "$PR_BRANCH"
