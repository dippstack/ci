name: self-check
# Механический leak-барьер ПУБЛИЧНОГО репо dippstack/ci (не дисциплина — проверка).
# Гоняется на PR в сам ci. Держит границу public/private для checks/scrub-secrets:
#  1) приватные паттерн-файлы НИКОГДА не коммитятся сюда (имя-барьер);
#  2) вендор-теллы не протекают в публичный код/паттерны;
#  3) patterns-public.json парсится; тесты движка зелёные до тега.
# Плюс проверки стража закрывающих слов: их гоняет рецепт, а не каждый потребитель — ради
# этого страж сюда и переехал из трёх копий (dippstack/ais#831).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: [self-hosted, linux, home]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: канон CI — только свои раннеры
        uses: ./checks/own-runner   # локальный путь: на PR в ci сам @main ещё без чека

      - name: приватные паттерн-файлы не должны жить в публичном ci
        run: |
          # Якорим на ИМЯ ФАЙЛА (basename), не на путь: папка scrub-secrets содержит '-secret',
          # path-glob '*-secret*.json' ложно ловил бы наш же patterns-public.json.
          bad="$(git ls-files | grep -E '(^|/)(scrub-extra[^/]*|patterns-private[^/]*|[^/]*-secret[^/]*)\.(json|ya?ml)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::приватные паттерн-файлы в публичном репо — им место в Vault проекта:"; echo "$bad"; exit 1
          fi
          echo "приватных паттерн-файлов нет"

      - name: вендор-теллы не должны протекать в публичный репо
        run: |
          # Эти имена = приватное IP (кто с кем интегрируется). Место — приватный оверлей в Vault.
          rc=0
          git grep -niE '(wildberries|wbaas|x_wbaas|diadoc|kontur)' -- . ':(exclude).github/workflows/self-check.yml' || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::вендор-имя в публичном репо — вынеси паттерн в приватный оверлей (Vault)"; exit 1
          elif [ "$rc" -eq 1 ]; then
            echo "вендор-теллов не найдено"
          else
            echo "::error::git grep rc=$rc — fail-closed"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: patterns-public.json парсится и непуст
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("checks/scrub-secrets/scrub_secrets/patterns-public.json"))
          pats = d.get("patterns", [])
          assert pats, "patterns-public.json пуст"
          for p in pats:
              assert {"id","regex","replacement"} <= set(p), f"неполный паттерн: {p.get('id')}"
              assert p.get("class","core") in {"core","dsn-creds","prose"}, f"класс: {p.get('id')}"
          print(f"OK: {len(pats)} паттернов, схема валидна")
          PY

      - name: pr-title — правило заголовка и shellcheck
        run: |
          bash checks/pr-title/tests/test.sh
          shellcheck -S warning checks/pr-title/check.sh checks/pr-title/tests/test.sh

      - name: pr-title — сам экшен грузится раннером (ловит битый YAML/expression в action.yml)
        # check.sh выше проверяет только правило; загрузку composite-экшена — только этот шаг.
        # Именно так упал gate у всех PR флота 23.09: пустой ${{ }} в комментарии рвал парсинг
        # action.yml, а check.sh это не видел, потому что запускался напрямую, в обход раннера.
        uses: ./checks/pr-title
        with:
          title: "self-check: композитный экшен грузится без TemplateValidationException"
          mode: error
      - name: deploy-digest — счёт, чипы, пропуск без работы
        run: |
          bash checks/deploy-digest/tests/test.sh
          shellcheck -S warning checks/deploy-digest/compose.sh checks/deploy-digest/tests/test.sh

      - name: тесты движка (контр-примеры на дрейф регекспа)
        working-directory: checks/scrub-secrets
        run: |
          python3 -m pip install -q -e . pytest
          python3 -m pytest -q tests/

      - name: explain-failure — контракт «модель необязательна» и shellcheck
        run: |
          # Стабы claude/gbrain на PATH, без сети: две строки на успех, пусто и rc 0 при любой беде.
          bash checks/explain-failure/tests/test.sh
          shellcheck -S warning checks/explain-failure/explain.sh checks/explain-failure/tests/test.sh

      - name: deliver.yml — старт без звука ночью и сторож «итог не пришёл» (стабы curl/date)
        run: |
          python3 -m pip install -q pyyaml
          bash checks/deliver-smoke/test.sh
          shellcheck -S warning checks/deliver-smoke/test.sh
      # Страж закрывающих слов: обе половины. Что он краснеет на потерянной задаче — половина
      # дела; что он МОЛЧИТ там, где всё в порядке, не менее важно, иначе его начнут обходить.
      # Форму самих воркфлоу не проверял никто, а флот на этом уже горел: пустое `${{ }}` в
      # комментарии (ci#35) не дало GitHub создать прогон вообще — не красный гейт, а тишина,
      # и нашлось это глазами. actionlint ловит ровно такое: синтаксис, выражения, формы `uses`.
      # Пин по версии и sha256, тот же метод, что у shellcheck в ci-python: раннер home без sudo.
      - name: actionlint — форма воркфлоу этого репозитория
        run: |
          set -euo pipefail
          if ! command -v actionlint >/dev/null 2>&1; then
            v=1.7.7
            url="https://github.com/rhysd/actionlint/releases/download/v${v}/actionlint_${v}_linux_amd64.tar.gz"
            sha="023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
            curl -fsSL -o /tmp/actionlint.tar.gz "$url"
            echo "${sha}  /tmp/actionlint.tar.gz" | sha256sum -c -
            tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
            mkdir -p "$HOME/.local/bin"
            install -m 755 /tmp/actionlint "$HOME/.local/bin/actionlint"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          # Без своей shellcheck-интеграции: форму воркфлоу мы гейтим здесь, а shell внутри
          # run-блоков — отдельный пласт с уже накопленными находками (намеренные одинарные
          # кавычки как SC2016, стилевой SC2129). Включить их значит сделать этот PR про
          # чужой shell; метки своих раннеров объявлены в `.github/actionlint.yaml`.
          actionlint -shellcheck=

      - name: проверки стража закрывающих слов
        run: |
          bash checks/pr-closes/tests/test-pr-closes-guard.sh
          shellcheck -S warning checks/pr-closes/pr-closes-guard.sh checks/pr-closes/tests/test-pr-closes-guard.sh

      # Проверки выше знают только скрипт. Проводку — action.yml, GITHUB_ACTION_PATH,
      # RUNNER_TEMP, чтение тела из события — не знает никто, и опечатка в пути оставила бы
      # self-check зелёным, а сломалось бы у потребителей после мержа. Поэтому зовём действие
      # ЛОКАЛЬНЫМ путём (как own-runner выше: на PR в ci сам @main ещё без этой правки) на
      # настоящем событии — на теле ЭТОГО PR. Заодно единственный репозиторий флота, который
      # владеет стражем и жил без него, теперь им и закрыт.
      - name: страж на своём же PR — проводка целиком
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./checks/pr-closes

      # И обратная половина проводки: на НЕ-PR событии страж обязан краснеть, а не молчать.
      # Без этой пары `if` выше мог бы однажды стать вечно-истинным, и гейт пропускал бы всё.
      - name: fail-closed — на чужом событии страж краснеет
        if: ${{ github.event_name != 'pull_request' }}
        id: notpr
        continue-on-error: true
        uses: ./checks/pr-closes
      - name: вердикт по fail-closed
        if: ${{ github.event_name != 'pull_request' }}
        env:
          OUTCOME: ${{ steps.notpr.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ] && { echo "ок: на событии '$GITHUB_EVENT_NAME' страж покраснел"; exit 0; }
          echo "::error::страж смолчал на событии '$GITHUB_EVENT_NAME' (outcome=$OUTCOME) — гейт не может покраснеть"
          exit 1
