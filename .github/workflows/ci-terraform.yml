name: ci-terraform
# Reusable CI-гейт флота для инфраструктурного кода (OpenTofu/Terraform). ЕДИНЫЙ ИСТОЧНИК — dippstack/ci.
# Зовётся тонким стабом из репы (dippcloud):
#   jobs: { ci: { uses: dippstack/ci/.github/workflows/ci-terraform.yml@v1,
#                 with: { plan-modules: '["live/home/y"]' },
#                 secrets: inherit } }
# Два джоба. validate — ставит tofu, tflint, trivy и зовёт infra/ci/gate.sh ci репы (без кредов;
# список модулей живёт в воротах). plan — только plan, НИКОГДА apply:
# читает state, показывает дифф в summary; на расписании с fail-on-drift красит расхождение
# инфры с git. Токены облаков живут в secrets вызывающей репы (secrets: inherit), в рецепте
# их нет. Раннер свой, home (правило 1 канона CI). Менять гейт — ТОЛЬКО здесь.
on:
  workflow_call:
    inputs:
      runner:
        description: "runs-on для гейта (по умолчанию свой раннер home)"
        type: string
        required: false
        default: home
      plan-modules:
        description: "JSON-список live-стеков для plan (без apply). Пусто — джоб пропускается."
        type: string
        required: false
        default: "[]"
      fail-on-drift:
        description: "plan с -detailed-exitcode: дифф между state и кодом красит джоб (для расписания дрейфа)."
        type: boolean
        required: false
        default: false
      tofu-version:
        type: string
        required: false
        default: "1.12.6"
      tflint-version:
        type: string
        required: false
        default: "v0.64.0"
      trivy-version:
        type: string
        required: false
        default: "v0.74.0"
    secrets:
      # Провайдерные токены вызывающей репы — в рецепте не хранятся, приходят через secrets: inherit.
      DO_TOKEN:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      # Адрес ведомости для backend "pg" (postgres://…). Нужен стекам, у которых state лежит в
      # Postgres; раннер ходит к нему как к локальному, строка в секрете вызывающей репы.
      PG_CONN_STR:
        required: false

permissions:
  contents: read   # least privilege: гейту нужен только read исходника

jobs:
  # Ворота репы без кредов: fmt, validate, tflint, trivy, tofu test по её списку модулей и
  # что ещё она объявила (dippcloud — тесты хостов). Рецепт только ставит инструменты.
  # На расписании дрейфа (fail-on-drift) не бежит: там вопрос один — разошлась ли инфра с git.
  validate:
    if: ${{ !inputs.fail-on-drift }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tofu-version }}
          tofu_wrapper: false

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ inputs.tflint-version }}

      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ inputs.trivy-version }}

      - name: ворота репы (infra/ci/gate.sh ci)
        run: bash infra/ci/gate.sh ci

  # Только plan, никогда apply. На PR из форка джоб не бежит: секреты форку не даются.
  plan:
    if: inputs.plan-modules != '[]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(inputs.plan-modules) }}
    env:
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PG_CONN_STR: ${{ secrets.PG_CONN_STR }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tofu-version }}
          # Без обёртки: она ловит код выхода tofu и при 2 («есть дифф») сама завершается с 0.
          # Шаг plan берёт код через PIPESTATUS, видел 0 вместо 2, и дрейф не краснел никогда
          # (dippcloud: «создать 19 записей» неделями шло зелёным).
          tofu_wrapper: false

      - name: init
        working-directory: ${{ matrix.module }}
        run: tofu init -input=false

      - name: plan (без apply; exit 2 = дифф между state и кодом)
        id: plan
        working-directory: ${{ matrix.module }}
        run: |
          set +e
          tofu plan -detailed-exitcode -no-color -input=false -out=tfplan | tee plan.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "exitcode=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "## plan: ${{ matrix.module }} (rc=$rc)"
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f tfplan
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || exit "$rc"

      - name: дрейф (только с fail-on-drift)
        if: inputs.fail-on-drift && steps.plan.outputs.exitcode == '2'
        run: |
          echo "::warning::дрейф в ${{ matrix.module }} — реальная инфраструктура разошлась с git"
          exit 1
