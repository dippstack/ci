name: deliver-selftest
# Живая проверка красного пути шлюза (dippstack/ais#784): тот же deliver.yml, что зовут продукты,
# только фикстура вместо продукта — deploy/autodeploy.sh пишет журнал с ошибкой и ANSI-цветами,
# deploy/health.sh отвечает 2 («хост отверг»). В «AI Sanbox» приходит 🚀 и следом ❌ с причиной
# от модели, хвостом и, если брейн ais узнал сбой, похожим случаем. Проверяет то, чего не
# проверить стабами: PATH раннера, claude и токен на imac, скачивание действия explain-failure,
# Телеграм. Только руками (workflow_dispatch): гонять после мержа в main и до переноса тега v1.
on:
  workflow_dispatch:
jobs:
  red:
    uses: ./.github/workflows/deliver.yml
    with:
      service: deliver-selftest
      driver: script
      runner: imac
      deploy-dir: $GITHUB_WORKSPACE/.github/deliver-selftest   # литерал: github.workspace в with: reusable пуст, шлюз подставит сам
      health-timeout: "60"
      vault-env: /Users/imac/sandbox/ais/.vault/env/ais-bot.env
