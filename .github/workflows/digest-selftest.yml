name: digest-selftest
# Живая проверка дайджеста (dippstack/ais#785): тот же digest.yml, что зовут продукты, по прогонам
# deliver самого репо ci; отправка — ботом ais в «AI Sanbox». Только руками (workflow_dispatch),
# гонять после мержа в main и до переноса тега v1; с ветки — для бисекции startup_failure.
on:
  workflow_dispatch:
jobs:
  digest:
    uses: ./.github/workflows/digest.yml
    with:
      runner: imac
      vault-env: /Users/imac/sandbox/ais/.vault/env/ais-bot.env
      hour-utc: "20"
      tz: Europe/Moscow
