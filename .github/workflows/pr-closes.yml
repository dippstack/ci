name: pr-closes
# ПЕРЕХОДНЫЙ ШИМ, живёт до конца раскатки pr-text и сносится следом (dippstack/ais#845).
#
# Рецепт переименован в `pr-text.yml`: он несёт теперь обе проверки текста PR — заголовок и
# закрывающее слово. Стабы пинятся подвижным `@v1`, поэтому исчезновение имени — ломающее
# изменение по правилу из README («ломающее → новый тег»), а красное окно тут не убирается
# перестановкой шагов: двинуть тег раньше стабов — три репы зовут исчезнувшее имя,
# заштамповать стабы раньше тега — `pr-text.yml@v1` ещё не существует.
#
# Шим разрывает этот узел: старое имя продолжает работать, пока стабы переезжают. Порядок —
# двинуть `v1` → раскатать `pr-text` во все репы реестра → снять старые стабы → снести этот
# файл. Ничего, кроме переадресации, тут быть не должно.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  text:
    uses: ./.github/workflows/pr-text.yml
