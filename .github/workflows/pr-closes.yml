name: pr-closes
# Reusable-гейт флота: PR, который сделал задачу, обязан её закрыть. ЕДИНЫЙ ИСТОЧНИК —
# dippstack/ci. Зовётся тонким стабом из репы:
#   jobs: { closes: { uses: dippstack/ci/.github/workflows/pr-closes.yml@v1 } }
#
# Зачем. GitHub автозакрывает задачу только по английским Closes / Fixes / Resolves. Русское
# «Закрывает #N» для него обычная ссылка: PR зелёный, работа в main, задача открыта молча.
# В монорепо ais так потерялись шесть сделанных задач подряд, прежде чем кто-то удивился
# длине бэклога. Тела PR по всему флоту пишутся такой же русской прозой.
#
# ОТДЕЛЬНЫМ РЕЦЕПТОМ, А НЕ ШАГОМ В ci-node/ci-python — в отличие от соседнего `pr-title`.
# Причина в триггере. Этот гейт обязан слушать `edited`: тело PR правят без коммита, и зелёный
# должен приходить от правки тела. Будь он шагом основного гейта, каждая правка тела
# перезапускала бы весь гейт целиком — у node-репы это `pnpm install` и тесты, минуты
# раннера на текстовую проверку, которая занимает девять секунд. Раннеры флота свои и
# общие на три организации; жечь их на этом неправильно.
#
# (`pr-title` живёт шагом и платит ту же цену на правке заголовка. Перенести его сюда —
# отдельный разговор и отдельная задача: рецептов он касается всех четырёх.)
#
# Логика стража — `checks/pr-closes`, менять ТОЛЬКО там. Проверки стража и его проводку
# гоняет `self-check` этого репозитория, а не каждый потребитель по отдельности.
#
# ЧЕГО ЭТОТ ГЕЙТ НЕ ВИДИТ, И ЭТО ОСОЗНАННО. Он срабатывает только на событие PR, поэтому PR,
# открытый до его появления, остаётся непроверенным, пока в нём что-нибудь не произойдёт:
# пуш, правка тела, reopen. Ручного запуска нет намеренно — `workflow_dispatch` бежит без
# контекста PR, ему пришлось бы номер входом и поход в API за телом, то есть вторая ветка
# кода ради разового случая. Как проверить открытый PR руками — в README рецепта.
on:
  workflow_call:

permissions:
  contents: read   # least privilege: гейту нужен только read исходника

jobs:
  closes:
    runs-on: [self-hosted, home]
    timeout-minutes: 5
    steps:
      # Без чекаута и без own-runner, в отличие от остальных рецептов. Страж читает тело PR
      # из события, дерево ему не нужно вовсе, а правило 1 канона на тех же событиях уже
      # проверил `ci.yml` той же репы. Второй чекаут на каждую правку тела PR — это минуты
      # общего раннера за пятисекундную текстовую проверку и красный гейт закрывающих слов
      # по причине, к закрывающим словам отношения не имеющей.
      - name: ключевое слово, которое GitHub понимает
        uses: dippstack/ci/checks/pr-closes@main
