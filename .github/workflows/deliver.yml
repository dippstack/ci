name: deliver
# ПЕРЕИСПОЛЬЗУЕМЫЙ шлюз доставки флота (workflow_call). Зовётся тонким стабом из репо продукта:
#   uses: dippstack/ci/.github/workflows/deliver.yml@v1
# Живёт здесь, а не в приватном dippstack/delivery, по той же причине, что и CI-рецепты:
# reusable-workflow из приватной репы нельзя звать через границу организации, а продукты
# (yan-app, marketspace-ai) — другие орги. Здесь только МЕХАНИКА: хосты, пути, клоны и
# секреты живут в стабах продуктов и в их .vault, сюда не попадают. Контур доставки целиком
# (реестр, kamal-шаблоны, health-шаблон, разворот) — dippstack/delivery.
#
# Один шлюз, три драйвера — потому что у продуктов разные реальности:
#   kamal  — сервис едет ОБРАЗОМ: собрать → запушить в самохостируемый реестр →
#            «выкатываю» в Телеграм → kamal deploy (zero-downtime + health + авто-откат).
#   script — сервис катится СВОИМ скриптом на хосте (pull-модель deploy/autodeploy.sh с гейтом
#            и откатом внутри, таймер на хосте зовёт его сам). Шлюз запускает тот же файл
#            ОТЦЕПЛЕННО (nohup, лог на хосте) и не становится родителем деплоя: отмена джобы
#            или моргнувший ssh не рвут гейт и откат на середине. Дальше ждёт, пока
#            deploy/health.sh подтвердит «на хосте этот код». Это ускорение таймера, а не
#            замена: если таймер уже катит, скрипт скажет «пропуск тика», и health дождётся.
#   watch  — ничего не запускать, только дождаться health (узел без flock: второй гейт поверх
#            тика таймера снёс бы candidate-worktree).
# Контракт с репо продукта для script/watch: deploy/autodeploy.sh и deploy/health.sh <sha>.
# health.sh: rc 0 = доехало (этот SHA или новее), rc 1 = ещё нет (ждём), rc 2 = хост уже
# отверг этот SHA (флап-гард, гейт красный) — ждать нечего, красный сразу.
# Скрипт остаётся ЕДИНСТВЕННЫМ путём выкатки (канон CI, правило 5): таймер на хосте и этот
# шлюз зовут один и тот же файл. Когда появится кластер, драйвер здесь сменится на ArgoCD,
# стабы в репо продуктов останутся той же формы.
#
# СЕКРЕТЫ — ИЗ .vault НА РАННЕРЕ, НЕ из GitHub Settings (один источник правды). Читаются
# грепом (не source: пробелы рвут source), чувствительное маскируется.
# ГРАНИЦА ДОВЕРИЯ = наши орги. Раннеры орговые, значит любой репо орга, позвавший этот шлюз,
# исполняет deploy-dir/vault-env на раннере. Это осознанно: чужих репо в оргах нет. Появится
# внешний потребитель — граница пересматривается (свой раннер, allowlist путей).
on:
  workflow_call:
    inputs:
      service:        { type: string, required: true }   # ais-bot | yan | marketspace/home | …
      environment:    { type: string, default: "dev" }   # dev=авто, prod=только руками (гейт у caller'а)
      runner:         { type: string, default: "home" }  # метка орг-раннера: home | imac
      driver:         { type: string, default: "kamal" } # kamal | script | watch
      vault-env:      { type: string, default: "" }      # путь к .vault-env НА РАННЕРЕ (REGISTRY_*, TELEGRAM_*); пусто = без Телеграма
      # — драйвер kamal —
      image-name:     { type: string, default: "" }      # bot-engine
      build-context:  { type: string, default: "." }
      dockerfile:     { type: string, default: "" }
      kamal-config:   { type: string, default: "" }      # путь к config/deploy.yml в репо
      # — драйверы script / watch —
      deploy-host:    { type: string, default: "" }      # ssh-алиас хоста с раннера (home); пусто = хост и есть раннер
      deploy-dir:     { type: string, default: "" }      # живой клон продукта на хосте (~/yan)
      health-timeout: { type: string, default: "600" }   # секунд ждать зелёного health

jobs:
  deliver:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 60                                  # выше любого health-timeout + гейт на хосте
    env:
      SERVICE: ${{ inputs.service }}
      ENVIRONMENT: ${{ inputs.environment }}
      DRIVER: ${{ inputs.driver }}
      VAULT_ENV: ${{ inputs.vault-env }}
      DEPLOY_HOST: ${{ inputs.deploy-host }}
      DEPLOY_DIR: ${{ inputs.deploy-dir }}
      HEALTH_TIMEOUT: ${{ inputs.health-timeout }}
      SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Чекаут: kamal собирает образ из репо; script/watch — только .github для own-runner.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ inputs.driver == 'kamal' && '' || '.github' }}

      - name: канон CI — только свои раннеры
        uses: dippstack/ci/checks/own-runner@main

      - name: входы драйвера
        run: |
          case "$DRIVER" in
            kamal)  [ -n "${{ inputs.image-name }}" ] && [ -n "${{ inputs.dockerfile }}" ] && [ -n "${{ inputs.kamal-config }}" ] \
                      || { echo "driver=kamal: нужны image-name, dockerfile, kamal-config" >&2; exit 1; } ;;
            script|watch) [ -n "$DEPLOY_DIR" ] || { echo "driver=$DRIVER: нужен deploy-dir" >&2; exit 1; } ;;
            *) echo "неизвестный driver: $DRIVER (kamal | script | watch)" >&2; exit 1 ;;
          esac
          echo "SHORT_SHA=${SHA:0:7}" >> "$GITHUB_ENV"
          echo "LOG_NAME=${SERVICE//\//-}" >> "$GITHUB_ENV"        # marketspace/home → marketspace-home

      - name: секреты из .vault (единственный источник, грепом + маска)
        run: |
          if [ ! -f "$VAULT_ENV" ]; then
            # Образному пути без реестра не жить; скриптовому без .vault-env — только без Телеграма.
            [ "$DRIVER" = kamal ] && { echo "нет .vault-env: $VAULT_ENV" >&2; exit 1; }
            echo "::warning title=deliver $SERVICE::нет .vault-env (${VAULT_ENV:-не задан}) — прогон без сообщений в Телеграм"
            exit 0
          fi
          get(){ grep -m1 "^$1=" "$VAULT_ENV" 2>/dev/null | cut -d= -f2- | sed 's/^["'"'"']//;s/["'"'"']$//'; }
          for k in REGISTRY_HOST REGISTRY_USER REGISTRY_PASS TELEGRAM_TOKEN TELEGRAM_CHAT; do
            v="$(get "$k")"; [ -n "$v" ] || continue
            case "$k" in REGISTRY_PASS|TELEGRAM_TOKEN) echo "::add-mask::$v";; esac
            echo "$k=$v" >> "$GITHUB_ENV"
          done

      - name: сборка + пуш в home-реестр (теги sha+latest)
        id: build
        if: ${{ inputs.driver == 'kamal' }}
        run: |
          REF="$REGISTRY_HOST/${{ inputs.image-name }}"
          echo "$REGISTRY_PASS" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
          docker build -f "${{ inputs.dockerfile }}" -t "$REF:$SHORT_SHA" -t "$REF:latest" "${{ inputs.build-context }}"
          docker push "$REF:$SHORT_SHA"; docker push "$REF:latest"
          echo "ref=$REF:$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: «выкатываю» → Телеграм
        id: notify
        if: ${{ env.TELEGRAM_TOKEN != '' }}
        run: |
          WHAT="${{ steps.build.outputs.ref }}"; [ -n "$WHAT" ] || WHAT="$SHORT_SHA"
          RESP=$(curl -s --max-time 15 "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT" --data-urlencode text="🚀 $SERVICE → $ENVIRONMENT: выкатываю $WHAT")
          echo "mid=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("result",{}).get("message_id",""))')" >> "$GITHUB_OUTPUT"

      - name: kamal deploy (zero-downtime + health + авто-откат)
        if: ${{ inputs.driver == 'kamal' }}
        run: |
          command -v kamal >/dev/null || gem install kamal
          kamal deploy -c "${{ inputs.kamal-config }}"

      # Один и тот же login-shell на хосте и на раннере (PATH из профиля: node, docker, make).
      # Деплой — отцепленно: nohup + лог в $HOME/.deliver/<service>.log на хосте, ssh возвращается
      # сразу. Лог не в клоне: deploy/local у yan держит докерные тома под root, и запись туда
      # падала «Permission denied» ещё до старта скрипта (прогон 35438697941).
      - name: deploy/autodeploy.sh на хосте (отцепленно)
        if: ${{ inputs.driver == 'script' }}
        run: |
          run(){ if [ -n "$DEPLOY_HOST" ]; then ssh -n -o BatchMode=yes -o ConnectTimeout=15 "$DEPLOY_HOST" "bash -lc $(printf %q "$1")"; else bash -lc "$1"; fi; }
          echo "→ ${DEPLOY_HOST:-локально ($(hostname -s))}: $DEPLOY_DIR/deploy/autodeploy.sh (лог: ~/.deliver/$LOG_NAME.log)"
          # Уже бежит (таймер катит, сборка висит на замке) — второй экземпляр не запускаем: у yan
          # он ждал бы замок 600с и пометил бы НАШ target как failed (прогон 35439161405, 19.09),
          # хотя хост просто ещё занят. Health ниже дождётся результата того, что уже бежит.
          # Запуск — отдельной строкой, а не хвостом «a && b && nohup c &»: там & уходит на всю
          # цепочку, фоновая подоболочка наследует stdout ssh-сессии и держит её открытой, пока
          # бежит autodeploy (шаг yan висел 30 минут, прогон 35439161405).
          SCRIPT="$(printf '%s\n' \
            "if pgrep -f 'bash deploy/autodeploy.sh' >/dev/null 2>&1; then echo 'autodeploy уже бежит на хосте — не дублирую, жду health'; exit 0; fi" \
            "mkdir -p ~/.deliver" \
            "cd $DEPLOY_DIR || exit 1" \
            "nohup bash deploy/autodeploy.sh >> ~/.deliver/$LOG_NAME.log 2>&1 </dev/null &" \
            'echo "autodeploy запущен (pid $!)"')"
          run "$SCRIPT"

      - name: health на хосте (deploy/health.sh ${{ github.sha }})
        if: ${{ inputs.driver == 'script' || inputs.driver == 'watch' }}
        run: |
          run(){ if [ -n "$DEPLOY_HOST" ]; then ssh -n -o BatchMode=yes -o ConnectTimeout=15 "$DEPLOY_HOST" "bash -lc $(printf %q "$1")"; else bash -lc "$1"; fi; }
          DEADLINE=$(( $(date +%s) + HEALTH_TIMEOUT ))
          # Шаг бежит под bash -e: провал run в простой команде завершил бы шаг на первой же
          # попытке (так упали прогоны 35438697941 и 35438702010) — берём rc через if.
          while :; do
            if run "cd $DEPLOY_DIR && bash deploy/health.sh $SHA"; then rc=0; else rc=$?; fi
            case $rc in
              0) echo "✅ health: $SERVICE на $SHORT_SHA"; exit 0 ;;
              2) echo "❌ хост отверг $SHORT_SHA (гейт/флап-гард) — см. лог ниже" >&2; break ;;
            esac
            [ "$(date +%s)" -lt "$DEADLINE" ] || { echo "❌ health не позеленел за ${HEALTH_TIMEOUT}с" >&2; break; }
            sleep 15
          done
          echo "--- хвост ~/.deliver/$LOG_NAME.log на хосте ---"
          run "tail -n 40 ~/.deliver/$LOG_NAME.log 2>/dev/null" || true
          exit 1

      - name: «готово» → Телеграм (правим тот же тред)
        if: ${{ success() && env.TELEGRAM_TOKEN != '' && steps.notify.outputs.mid != '' }}
        run: |
          WHAT="${{ steps.build.outputs.ref }}"; [ -n "$WHAT" ] || WHAT="$SHORT_SHA"
          curl -s --max-time 15 "https://api.telegram.org/bot$TELEGRAM_TOKEN/editMessageText" \
            --data-urlencode chat_id="$TELEGRAM_CHAT" --data-urlencode message_id="${{ steps.notify.outputs.mid }}" \
            --data-urlencode text="✅ $SERVICE → $ENVIRONMENT: готово ($WHAT)"

      - name: «упало» → Телеграм (откат сделал сам хост)
        if: ${{ failure() && env.TELEGRAM_TOKEN != '' && steps.notify.outputs.mid != '' }}
        run: |
          curl -s --max-time 15 "https://api.telegram.org/bot$TELEGRAM_TOKEN/editMessageText" \
            --data-urlencode chat_id="$TELEGRAM_CHAT" --data-urlencode message_id="${{ steps.notify.outputs.mid }}" \
            --data-urlencode text="❌ $SERVICE → $ENVIRONMENT: упало, откат на хосте — $RUN_URL"
