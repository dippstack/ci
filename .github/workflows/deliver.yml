name: deliver
# ПЕРЕИСПОЛЬЗУЕМЫЙ шлюз доставки флота (workflow_call). Зовётся тонким стабом из репо продукта:
#   uses: dippstack/ci/.github/workflows/deliver.yml@v1
# Живёт здесь, а не в приватном dippstack/delivery, по той же причине, что и CI-рецепты:
# reusable-workflow из приватной репы нельзя звать через границу организации, а продукты
# (yan-app, marketspace-ai) — другие орги. Здесь только МЕХАНИКА: хосты, пути, клоны и
# секреты живут в стабах продуктов и в их .vault, сюда не попадают.
#
# В Телеграм — ОДНО итоговое сообщение на выкатку (решение Егора 2026-09-26, ais-render-vault
# dev-loop/14): ✅ без звука, ❌ со звуком, с короткой причиной и хвостом журнала хоста. За ходом
# выкатки смотрят в GitHub. Старта, его правки, ночной тишины, сторожа отмены, причины от модели
# и драйвера kamal (ни одного потребителя) больше нет.
#
# Два драйвера — потому что у продуктов разные реальности:
#   script — сервис катится СВОИМ скриптом на хосте (pull-модель deploy/autodeploy.sh с гейтом
#            и откатом внутри, таймер на хосте зовёт его сам). Шлюз запускает тот же файл
#            ОТЦЕПЛЕННО (nohup, лог на хосте) и не становится родителем деплоя: отмена джобы
#            или моргнувший ssh не рвут гейт и откат на середине. Дальше ждёт, пока
#            deploy/health.sh подтвердит «на хосте этот код». Это ускорение таймера, а не
#            замена: если таймер уже катит, скрипт скажет «пропуск тика», и health дождётся.
#   watch  — ничего не запускать, только дождаться health (узел без flock: второй гейт поверх
#            тика таймера снёс бы candidate-worktree).
# Контракт с репо продукта для script/watch: deploy/autodeploy.sh (держит СВОЙ flock -n: второй
# экземпляр поверх таймера выходит «пропуском», а не ждёт и не ломает) и deploy/health.sh <sha>.
# health.sh: rc 0 = доехало (этот SHA или новее), rc 1 = ещё нет (ждём), rc 2 = хост уже
# отверг этот SHA (флап-гард, гейт красный) — ждать нечего, красный сразу.
# Скрипт остаётся ЕДИНСТВЕННЫМ путём выкатки (канон CI, правило 5): таймер на хосте и этот
# шлюз зовут один и тот же файл. Когда появится кластер, драйвер здесь сменится на ArgoCD,
# стабы в репо продуктов останутся той же формы.
#
# СЕКРЕТЫ — ИЗ .vault НА РАННЕРЕ, НЕ из GitHub Settings (один источник правды). Читаются
# грепом (не source: пробелы рвут source), чувствительное маскируется.
# ГРАНИЦА ДОВЕРИЯ = наши орги. Раннеры орговые, значит любой репо орга, позвавший этот шлюз,
# исполняет deploy-dir/vault-env на раннере. Это осознанно: чужих репо в оргах нет. Появится
# внешний потребитель — граница пересматривается (свой раннер, allowlist путей).
on:
  workflow_call:
    inputs:
      service:        { type: string, required: true }   # ais-bot | yan | marketspace/home | …
      environment:    { type: string, default: "dev" }   # dev=авто, prod=только руками (гейт у caller'а)
      runner:         { type: string, default: "home" }  # метка орг-раннера: home | imac
      driver:         { type: string, default: "script" } # script | watch
      vault-env:      { type: string, default: "" }      # путь к env НА РАННЕРЕ (TELEGRAM_BOT_TOKEN + TELEGRAM_DEVSUPPORT_CHAT/THREAD); пусто = без Телеграма
      deploy-host:    { type: string, default: "" }      # ssh-алиас хоста с раннера (home); пусто = хост и есть раннер
      deploy-dir:     { type: string, default: "" }      # живой клон продукта на хосте (~/yan)
      health-timeout: { type: string, default: "600" }   # секунд ждать зелёного health

jobs:
  deliver:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 60                                  # выше любого health-timeout + гейт на хосте
    env:
      SERVICE: ${{ inputs.service }}
      ENVIRONMENT: ${{ inputs.environment }}
      DRIVER: ${{ inputs.driver }}
      VAULT_ENV: ${{ inputs.vault-env }}
      DEPLOY_HOST: ${{ inputs.deploy-host }}
      DEPLOY_DIR: ${{ inputs.deploy-dir }}
      HEALTH_TIMEOUT: ${{ inputs.health-timeout }}
      SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      # Чекаут — только .github: заголовок и тело коммита для сообщения, deploy-dir с литералом
      # $GITHUB_WORKSPACE (фикстура deliver-selftest). Код продукта катит сам хост.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: входы драйвера
        run: |
          case "$DRIVER" in
            script|watch) [ -n "$DEPLOY_DIR" ] || { echo "driver=$DRIVER: нужен deploy-dir" >&2; exit 1; } ;;
            *) echo "неизвестный driver: $DRIVER (script | watch)" >&2; exit 1 ;;
          esac
          # health-timeout идёт в $(( )), поэтому только цифры; и не выше потолка джобы (60 мин),
          # иначе вместо «health не позеленел» с хвостом лога будет безликий обрыв по timeout-minutes.
          case "$HEALTH_TIMEOUT" in ''|*[!0-9]*) echo "health-timeout должен быть числом секунд: '$HEALTH_TIMEOUT'" >&2; exit 1;; esac
          [ "$HEALTH_TIMEOUT" -le 3000 ] || { echo "health-timeout $HEALTH_TIMEOUT > 3000с — выше потолка джобы" >&2; exit 1; }
          # deploy-dir может начинаться с литерала $GITHUB_WORKSPACE (в with: стаба выражение
          # github.workspace пусто — контекст reusable его не даёт): подставляем путь раннера сами.
          case "$DEPLOY_DIR" in '$GITHUB_WORKSPACE'*) DEPLOY_DIR="$GITHUB_WORKSPACE${DEPLOY_DIR#\$GITHUB_WORKSPACE}"; echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV";; esac
          echo "SHORT_SHA=${SHA:0:7}" >> "$GITHUB_ENV"
          echo "LOG_NAME=$(printf %s "$SERVICE" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_ENV"   # marketspace/home → marketspace-home
          # Заголовок коммита для чипа сообщения: `(#N)` в конце — squash-мерж PR, тогда ссылка
          # на PR и «#N » впереди (сам «(#N)» из заголовка убираем, номер уже есть ссылкой);
          # иначе ссылка на сам коммит, без номера. HTML-экранируем один раз тут.
          RAW_TITLE="$(git log -1 --format=%s "$SHA")"
          PR_NUM="$(printf '%s' "$RAW_TITLE" | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p')"
          if [ -n "$PR_NUM" ]; then
            RAW_TITLE="$(printf '%s' "$RAW_TITLE" | sed -E 's/ \(#[0-9]+\)$//')"
            LINK="$REPO_URL/pull/$PR_NUM"
            NUM_PREFIX="#$PR_NUM "
          else
            LINK="$REPO_URL/commit/$SHA"
            NUM_PREFIX=""
          fi
          TITLE="$(printf '%s' "$RAW_TITLE" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "LINK=$LINK" >> "$GITHUB_ENV"
          echo "NUM_PREFIX=$NUM_PREFIX" >> "$GITHUB_ENV"
          # Окружение в строку не выводим, если оно дефолтное (dev).
          ENV_SUFFIX=""
          [ "$ENVIRONMENT" = dev ] || ENV_SUFFIX=" <code>$ENVIRONMENT</code>"
          echo "ENV_SUFFIX=$ENV_SUFFIX" >> "$GITHUB_ENV"
          # Саммари для успеха: первый абзац тела сквош-коммита (до первой пустой строки),
          # без строк-трейлеров (Co-authored-by и т.п.) и markdown-разметки. Пусто — цитаты нет.
          BODY="$(git log -1 --format=%b "$SHA")"
          PARA="$(printf '%s\n' "$BODY" | awk 'BEGIN{p=0} /^[[:space:]]*$/{ if (p) exit; next } { print; p=1 }')"
          FILTERED="$(printf '%s\n' "$PARA" | grep -vE '^(Co-authored-by:|Co-Authored-By:|Signed-off-by:|#|🤖|Closes)' || true)"
          SUMMARY="$(printf '%s' "$FILTERED" | tr '\n' ' ' | sed -E 's/\*\*//g; s/`//g; s/[[:space:]]+/ /g; s/^ //; s/ $//')"
          if [ "${#SUMMARY}" -gt 600 ]; then SUMMARY="${SUMMARY:0:599}…"; fi
          SUMMARY="$(printf '%s' "$SUMMARY" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"
          echo "SUMMARY=$SUMMARY" >> "$GITHUB_ENV"

      - name: секреты из env (единственный источник, грепом + маска)
        run: |
          # env бота продукта на раннере: <проект>/.vault/env/<проект>-bot.env.
          if [ ! -f "$VAULT_ENV" ]; then
            echo "::warning title=deliver $SERVICE::нет env (${VAULT_ENV:-не задан}) — прогон без сообщения в Телеграм"
            exit 0
          fi
          # Значение до инлайн-комментария (в примерах ключи описаны прямо в строке), без хвостовых пробелов и кавычек.
          get(){ grep -m1 "^$1=" "$VAULT_ENV" 2>/dev/null | cut -d= -f2- | sed -E 's/[[:space:]]+#.*$//; s/[[:space:]]+$//; s/^["'"'"']//; s/["'"'"']$//'; }
          for k in TELEGRAM_BOT_TOKEN TELEGRAM_DEVSUPPORT_CHAT TELEGRAM_DEVSUPPORT_THREAD; do
            v="$(get "$k")"; [ -n "$v" ] || continue
            [ "$k" = TELEGRAM_BOT_TOKEN ] && echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_ENV"
          done

      # Один и тот же login-shell на хосте и на раннере (PATH из профиля: node, docker, make).
      # Деплой — отцепленно: nohup + лог в $HOME/.deliver/<service>.log на хосте, ssh возвращается
      # сразу. Лог не в клоне: deploy/local у yan держит докерные тома под root, и запись туда
      # падала «Permission denied» ещё до старта скрипта (прогон 35438697941).
      - name: deploy/autodeploy.sh на хосте (отцепленно)
        if: ${{ inputs.driver == 'script' }}
        run: |
          echo "FAIL_WHAT=Не удалось запустить выкатку на хосте по ssh." >> "$GITHUB_ENV"   # health-шаг перепишет, если дойдёт
          echo "PROD_STATE=Прод не тронут." >> "$GITHUB_ENV"
          run(){ if [ -n "$DEPLOY_HOST" ]; then ssh -n -o BatchMode=yes -o ConnectTimeout=15 "$DEPLOY_HOST" "bash -lc $(printf %q "$1")"; else bash -lc "$1"; fi; }
          echo "→ ${DEPLOY_HOST:-локально ($(hostname -s))}: $DEPLOY_DIR/deploy/autodeploy.sh (лог: ~/.deliver/$LOG_NAME.log)"
          # Второй экземпляр поверх таймера НЕ проверяем тут pgrep'ом: строка поиска попадала
          # в argv нашей же login-оболочки на хосте, гард срабатывал всегда, и script молча
          # вырождался в watch. Сериализация — дело самого autodeploy.sh (flock -n внутри, часть
          # контракта): бежит таймер → наш экземпляр скажет «пропуск» и выйдет, health дождётся.
          # Запуск — отдельной строкой, а не хвостом «a && b && nohup c &»: там & уходит на всю
          # цепочку, фоновая подоболочка наследует stdout ssh-сессии и держит её открытой.
          SCRIPT="$(printf '%s\n' \
            "mkdir -p ~/.deliver" \
            "cd $DEPLOY_DIR || exit 1" \
            "nohup bash deploy/autodeploy.sh >> ~/.deliver/$LOG_NAME.log 2>&1 </dev/null &" \
            'echo "autodeploy запущен (pid $!)"')"
          run "$SCRIPT"

      - name: health на хосте (deploy/health.sh ${{ github.sha }})
        if: ${{ inputs.driver == 'script' || inputs.driver == 'watch' }}
        run: |
          run(){ if [ -n "$DEPLOY_HOST" ]; then ssh -n -o BatchMode=yes -o ConnectTimeout=15 "$DEPLOY_HOST" "bash -lc $(printf %q "$1")"; else bash -lc "$1"; fi; }
          DEADLINE=$(( $(date +%s) + HEALTH_TIMEOUT ))
          # Шаг бежит под bash -e: провал run в простой команде завершил бы шаг на первой же
          # попытке (так упали прогоны 35438697941 и 35438702010) — берём rc через if.
          while :; do
            if run "cd $DEPLOY_DIR && bash deploy/health.sh $SHA"; then rc=0; else rc=$?; fi
            case $rc in
              0) echo "✅ health: $SERVICE на $SHORT_SHA"; exit 0 ;;
              2) echo "FAIL_WHAT=Хост отверг коммит: проверка на хосте красная." >> "$GITHUB_ENV"
                 echo "PROD_STATE=Прод на прежней версии." >> "$GITHUB_ENV"
                 echo "❌ хост отверг $SHORT_SHA (гейт/флап-гард) — см. лог ниже" >&2; break ;;
            esac
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              # Ждали меньше минуты — говорим в секундах, а не «за 0 минут».
              if [ "$HEALTH_TIMEOUT" -ge 60 ]; then WAITED="$((HEALTH_TIMEOUT / 60)) минут"; else WAITED="${HEALTH_TIMEOUT} секунд"; fi
              echo "FAIL_WHAT=Сервис не подтвердил этот коммит за $WAITED." >> "$GITHUB_ENV"
              # Обрыв ssh и «ещё не доехало» здесь неразличимы, откат хоста мы не видели —
              # обещать его нельзя, честнее сказать, что состояние неизвестно.
              echo "PROD_STATE=Состояние прода неизвестно: хост откатывает сам по смоуку, подтверждения нет." >> "$GITHUB_ENV"
              echo "❌ health не позеленел за ${HEALTH_TIMEOUT}с" >&2; break
            fi
            sleep 15
          done
          if [ "$DRIVER" = watch ]; then
            echo "driver=watch: шлюз ничего не запускал — смотри журнал таймера на узле $DEPLOY_DIR"
          else
            echo "--- хвост ~/.deliver/$LOG_NAME.log на хосте (лог нашего запуска; катил таймер — смотри его журнал) ---"
            TAIL_OUT="$(run "tail -n 40 ~/.deliver/$LOG_NAME.log 2>/dev/null || echo '(лога нет: скрипт не стартовал или писал в другое место)'")" || true
            printf '%s\n' "$TAIL_OUT"
            # Хвост для итогового сообщения в Телеграм: последние 12 строк в файл, итог-шаг читает.
            # Цвета ANSI из журнала хоста в Телеграм и модели не нужны.
            printf '%s\n' "$TAIL_OUT" | sed -E $'s/\e\\[[0-9;]*[A-Za-z]//g' | tail -n 12 > "$RUNNER_TEMP/host-tail.txt"
          fi
          exit 1

      # ОДНО итоговое сообщение. ✅ уходит без звука: зелёная выкатка — не повод звонить. ❌ звонит,
      # вторая строка курсивом — что случилось и в каком состоянии прод (фраза закрытого словаря,
      # dippstack/ais#781), в свёрнутой цитате — хвост журнала хоста. Отмена прогона сообщения не
      # шлёт: за ходом выкатки смотрят в GitHub. Проверка без сети — checks/deliver-smoke/test.sh.
      - name: итог → Телеграм (одно сообщение)
        id: summary
        if: ${{ !cancelled() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_DEVSUPPORT_CHAT != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          send(){ # $1=text, дальше — доп. args curl (parse_mode)
            local text="$1"; shift
            curl -s --max-time 15 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode chat_id="$TELEGRAM_DEVSUPPORT_CHAT" \
              ${TELEGRAM_DEVSUPPORT_THREAD:+--data-urlencode message_thread_id=$TELEGRAM_DEVSUPPORT_THREAD} \
              ${QUIET:+--data-urlencode disable_notification=true} \
              --data-urlencode disable_web_page_preview=true --data-urlencode text="$text" "$@"
          }
          ok(){ printf '%s' "$1" | grep -q '"ok":true'; }
          esc(){ printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          if [ "$JOB_STATUS" = success ]; then
            QUIET=1
            T="$(printf '✅ <a href="%s">%s</a><a href="%s">%s%s</a>%s' \
              "$REPO_URL" "$REPO" "$LINK" "$NUM_PREFIX" "$TITLE" "$ENV_SUFFIX")"
            [ -n "$SUMMARY" ] && T="$(printf '%s\n<blockquote expandable>%s</blockquote>' "$T" "$SUMMARY")"
          else
            QUIET=""
            REASON="$(esc "${FAIL_WHAT:-Выкатка упала до хоста.}") ${PROD_STATE:-Прод не тронут.}"
            T="$(printf '❌ <a href="%s">%s</a><a href="%s">%s%s</a>%s\n<i>%s</i>' \
              "$REPO_URL" "$REPO" "$RUN_URL" "$NUM_PREFIX" "$TITLE" "$ENV_SUFFIX" "$REASON")"
            if [ -f "$RUNNER_TEMP/host-tail.txt" ]; then
              T="$(printf '%s\n<blockquote expandable><code>%s</code></blockquote>' "$T" "$(esc "$(cat "$RUNNER_TEMP/host-tail.txt")")")"
            fi
          fi
          RESP="$(send "$T" --data-urlencode parse_mode=HTML || true)"
          # Telegram отверг разметку — один повтор тем же текстом без parse_mode (теги будут видны как есть).
          ok "$RESP" || RESP="$(send "$T" || true)"
          ok "$RESP" || echo "::warning title=deliver $SERVICE::telegram итог не прошёл: $RESP"
