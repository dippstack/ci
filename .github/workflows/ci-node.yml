name: ci-node
# Reusable CI-гейт флота для Node/pnpm репо. ЕДИНЫЙ ИСТОЧНИК — dippstack/ci.
# Зовётся тонким стабом из репы:
#   jobs: { ci: { uses: dippstack/ci/.github/workflows/ci-node.yml@v1 } }
# Лёгкий и частый (каждый PR) → на self-hosted home-раннере (не жжём GitHub-hosted минуты).
# Раннер резолвится в контуре ВЫЗЫВАЮЩЕЙ репы (у yan свой home-runner, у bali свой).
# Тяжёлое (build/Expo/нативка) тут НЕ гейтим. Менять гейт — ТОЛЬКО здесь.
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: "22"
      pnpm-version:
        type: string
        required: false
        default: "10.0.0"

permissions:
  contents: read   # least privilege: гейту нужен только read исходника

jobs:
  static:
    runs-on: [self-hosted, home]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # база origin/<base> нужна anti-self-approval ignore в скраб-шаге

      # Секрет-скан единым движком (тот же, что у python/vault-репо) — закрываем дыру:
      # Node-репо раньше не гейтились на секреты вообще. tier=core+dsn-creds (код).
      # Нужен python3 на self-hosted home-раннере. Нет секрета → мгновенно дальше.
      - name: секрет-скан (единый движок, tier=core+dsn-creds)
        uses: dippstack/ci/checks/scrub-secrets@main
        with:
          tier: core+dsn-creds
          base_ref: ${{ github.base_ref }}

      # pnpm ДО setup-node — иначе cache: pnpm не найдёт менеджер.
      #
      # dest в runner.temp, а НЕ в ~/setup-pnpm по умолчанию. На self-hosted раннере
      # домашняя директория переживает прогоны: внутри ~/setup-pnpm оседает стор от
      # прошлого раза, и следующая установка падает на попытке снести непустую папку
      # (ENOTEMPTY ... rmdir '~/setup-pnpm/node_modules/.bin/store/v10/index/..').
      # runner.temp своя на каждый прогон и чистится — установка всегда с нуля.
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      # ретрай: pnpm-воркер изредка падает 'exited with code 1' на self-hosted
      # (флаки линковка стора) — один повтор гасит транзиент, не маскируя реальный провал.
      - name: pnpm install (--frozen-lockfile, +1 ретрай на флаки-краш воркера)
        run: pnpm install --frozen-lockfile || { echo "::warning::pnpm install упал — ретрай"; pnpm install --frozen-lockfile; }
      - run: pnpm typecheck
      - run: pnpm lint

      # Тесты. `--if-present`: репа без скрипта `test` проходит молча, репа со
      # скриптом обязана быть зелёной. До этого шага гейт проверял только код —
      # что он ВАЛИДЕН, но не что он РАБОТАЕТ; поведение доживало до человека.
      # Тяжёлое (симулятор, нативка, сквозные сценарии) сюда по-прежнему не
      # заезжает: у него своя машина и свой поток в репе.
      - name: тесты (если репа их объявила)
        run: pnpm run --if-present test
