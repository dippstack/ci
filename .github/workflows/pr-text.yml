name: pr-text
# Reusable-гейт флота на ТЕКСТ pull request — заголовок и тело. ЕДИНЫЙ ИСТОЧНИК —
# dippstack/ci. Зовётся тонким стабом из репы:
#   jobs: { text: { uses: dippstack/ci/.github/workflows/pr-text.yml@v1 } }
#
# Проверяет две вещи, и обе про то, что человек прочитает потом.
#
# ЗАГОЛОВОК — человеческим предложением, без типа `feat(scope):` (dippstack/ais#788). Чип в
# Telegram цитирует заголовок сквош-коммита, то есть заголовок PR.
#
# ЗАКРЫВАЮЩЕЕ СЛОВО В ТЕЛЕ. GitHub автозакрывает задачу только по английским
# Closes / Fixes / Resolves. Русское «Закрывает #N» для него обычная ссылка: PR зелёный,
# работа в main, задача открыта молча. В монорепо ais так потерялись шесть сделанных задач
# подряд, прежде чем кто-то удивился длине бэклога.
#
# ОТДЕЛЬНЫМ ЛЁГКИМ РЕЦЕПТОМ, А НЕ ШАГАМИ В ci-node/ci-python/ci-vault/ci-terraform, где обе
# проверки и жили раньше. Причина в триггере: текст PR правят без коммита, поэтому гейт обязан
# слушать `edited` — иначе красный заголовок нечем погасить, кроме пустого коммита. А будь эти
# проверки шагами основного гейта, каждая правка текста перезапускала бы его целиком: замеренные
# прогоны потребителей 136–431 секунда, в основном очередь на одном раннере орги. Секундная
# текстовая проверка не должна стоить минут общего раннера (dippstack/ais#845).
#
# Условный пропуск тяжёлых шагов на `edited` рассмотрен и отвергнут: правка текста давала бы
# зелёный прогон, пропустивший настоящие проверки, и этот зелёный перекрывал бы предыдущий
# красный. Гейт, который не может покраснеть, — известные грабли флота.
#
# Логика — `checks/pr-title` и `checks/pr-closes`, менять ТОЛЬКО там. Проверки обоих и их
# проводку гоняет `self-check` этого репозитория, а не каждый потребитель по отдельности.
#
# ЧЕГО ЭТОТ ГЕЙТ НЕ ВИДИТ, И ЭТО ОСОЗНАННО. Он срабатывает только на событие PR, поэтому PR,
# открытый до его появления, остаётся непроверенным, пока в нём что-нибудь не произойдёт:
# пуш, правка тела, reopen. Ручного запуска нет намеренно — `workflow_dispatch` бежит без
# контекста PR, ему пришлось бы номер входом и поход в API за телом, то есть вторая ветка
# кода ради разового случая. Как проверить открытый PR руками — в README рецепта.
on:
  workflow_call:

permissions:
  contents: read   # least privilege: гейту нужен только read исходника

jobs:
  text:
    runs-on: [self-hosted, home]
    timeout-minutes: 5
    steps:
      # Без чекаута и без own-runner, в отличие от остальных рецептов. Обе проверки читают
      # текст PR из события, дерево им не нужно вовсе, а правило 1 канона на тех же событиях
      # уже проверил `ci.yml` той же репы. Лишний чекаут на каждую правку текста — это минуты
      # общего раннера за секундную проверку и красный гейт по причине, к тексту PR отношения
      # не имеющей.
      - name: заголовок PR — предложением, без типа
        uses: dippstack/ci/checks/pr-title@main
        with:
          title: ${{ github.event.pull_request.title }}
          mode: error

      - name: ключевое слово, которое GitHub понимает
        uses: dippstack/ci/checks/pr-closes@main
