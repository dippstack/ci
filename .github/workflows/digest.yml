name: digest
# ПЕРЕИСПОЛЬЗУЕМЫЙ дайджест дня выкаток (workflow_call), dippstack/ais#785. Зовётся тонким стабом
# из репо продукта по расписанию (23:00 по зоне читателя) — только там, где его включили:
#   on: { schedule: [{ cron: "0 20 * * *" }], workflow_dispatch: }
#   jobs: { digest: { uses: dippstack/ci/.github/workflows/digest.yml@v1, with: { runner: imac, vault-env: … } } }
# Данные — история прогонов deliver этого репо за сутки (gh run list с github.token), никаких
# журналов и сервисов. Работы за сутки не было — дайджест не шлётся (правило владельца 23.09).
# Текст собирает checks/deploy-digest (проза с датой, репо ссылкой, красные и висящие чипами).
# Токен и чат — из vault-env на раннере, как у deliver.
on:
  workflow_call:
    inputs:
      runner:     { type: string, default: "imac" }     # метка орг-раннера, где лежит env бота
      vault-env:  { type: string, required: true }      # env бота проекта на раннере: TELEGRAM_BOT_TOKEN + DEVSUPPORT_CHAT/THREAD
      workflow:   { type: string, default: "deliver" }  # чьи прогоны считать
      min-runs:   { type: string, default: "1" }        # меньше завершённых прогонов за сутки — молчим
      tz:         { type: string, default: "Europe/Moscow" }
      hour-utc:   { type: string, default: "20" }       # час расписания стаба по UTC: окно — ровно сутки до сегодняшнего такого часа

jobs:
  digest:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 5
    env:
      REPO: ${{ github.repository }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      VAULT_ENV: ${{ inputs.vault-env }}
      WORKFLOW: ${{ inputs.workflow }}
      HOUR_UTC: ${{ inputs.hour-utc }}
    steps:
      # own-runner грепает .github/workflows рабочего каталога — без чекаута он проверял бы пустоту.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: канон CI — только свои раннеры
        uses: dippstack/ci/checks/own-runner@main

      - name: секреты из env бота (грепом + маска)
        run: |
          [ -f "$VAULT_ENV" ] || { echo "::warning title=digest::нет env ($VAULT_ENV) — без Телеграма"; exit 0; }
          get(){ grep -m1 "^$1=" "$VAULT_ENV" 2>/dev/null | cut -d= -f2- | sed -E 's/[[:space:]]+#.*$//; s/[[:space:]]+$//; s/^["'"'"']//; s/["'"'"']$//'; }
          for k in TELEGRAM_BOT_TOKEN TELEGRAM_DEVSUPPORT_CHAT TELEGRAM_DEVSUPPORT_THREAD; do
            v="$(get "$k")"; [ -n "$v" ] || continue
            [ "$k" = TELEGRAM_BOT_TOKEN ] && echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_ENV"
          done

      - name: прогоны за сутки
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Окно — ровно сутки между двумя часами расписания (hour-utc): [вчера HH:00, сегодня HH:00).
          # Расписание GitHub плавает на десятки минут, а окно «последние 24 часа» то рвётся, то
          # накладывается; два фиксированных края стыкуют окна встык без двойного учёта — прогон,
          # созданный после сегодняшнего HH:00, уходит в завтрашний дайджест. Считаем python'ом:
          # date -v (BSD) и -d (GNU) на раннерах разные.
          case "$HOUR_UTC" in ''|*[!0-9]*) echo "::error title=digest::hour-utc должен быть часом 0–23: '$HOUR_UTC'"; exit 1;; esac
          read -r SINCE UNTIL < <(python3 -c "import datetime as d; n=d.datetime.now(d.timezone.utc); u=n.replace(hour=int('$HOUR_UTC'),minute=0,second=0,microsecond=0); u=u if u<=n else u-d.timedelta(days=1); f='%Y-%m-%dT%H:%M:%SZ'; print((u-d.timedelta(days=1)).strftime(f), u.strftime(f))")
          # Ошибка gh — не «работы не было»: молчание запрещено, красим джобу с текстом ошибки.
          if ! RUNS="$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --created "$SINCE..$UNTIL" --limit 200 \
                   --json conclusion,status,displayTitle,url,headSha,createdAt 2>"$RUNNER_TEMP/gh.err")"; then
            echo "::error title=digest::gh run list не ответил: $(head -c 300 "$RUNNER_TEMP/gh.err")"; exit 1
          fi
          # gh даёт диапазон включительно по обоим краям; правый край режем сами, чтобы не считать дважды.
          RUNS="$(printf '%s' "$RUNS" | python3 -c "import json,sys; u=sys.argv[1]; print(json.dumps([r for r in json.load(sys.stdin) if (r.get('createdAt') or '') < u]))" "$UNTIL")"
          echo "прогонов $WORKFLOW за окно $SINCE — $UNTIL: $(printf '%s' "$RUNS" | grep -o '"url"' | wc -l | tr -d ' ')"
          { echo "json<<RUNS_EOF"; printf '%s\n' "$RUNS"; echo "RUNS_EOF"; } >> "$GITHUB_OUTPUT"

      - name: текст дайджеста
        id: text
        uses: dippstack/ci/checks/deploy-digest@main
        with:
          runs-json: ${{ steps.runs.outputs.json }}
          repo: ${{ github.repository }}
          repo-url: ${{ github.server_url }}/${{ github.repository }}
          min-runs: ${{ inputs.min-runs }}
          tz: ${{ inputs.tz }}

      - name: дайджест → Телеграм
        if: ${{ steps.text.outputs.skipped != 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_DEVSUPPORT_CHAT != '' }}
        env:
          TEXT: ${{ steps.text.outputs.text }}
        run: |
          send(){ curl -s --max-time 15 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode chat_id="$TELEGRAM_DEVSUPPORT_CHAT" \
              ${TELEGRAM_DEVSUPPORT_THREAD:+--data-urlencode message_thread_id=$TELEGRAM_DEVSUPPORT_THREAD} \
              --data-urlencode disable_web_page_preview=true --data-urlencode text="$TEXT" "$@"; }
          RESP="$(send --data-urlencode parse_mode=HTML || true)"
          printf '%s' "$RESP" | grep -q '"ok":true' || RESP="$(send || true)"
          printf '%s' "$RESP" | grep -q '"ok":true' && echo "дайджест отправлен" || echo "::warning title=digest::telegram не принял: $RESP"
