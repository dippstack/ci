name: ci-python
# Reusable CI-гейт флота для Python/shell репо. ЕДИНЫЙ ИСТОЧНИК — dippstack/ci.
# Зовётся тонким стабом из репы по подвижному тегу v1 (канон CI 2026-09-19):
#   jobs: { ci: { uses: dippstack/ci/.github/workflows/ci-python.yml@v1 } }
# Шаги гардятся на наличие файла/цели → один рецепт покрывает репы с мелкими отличиями
# (у одной есть scripts/check-paths.sh, у другой — make verify). Менять гейт — ТОЛЬКО здесь.
on:
  workflow_call:
    inputs:
      runner:
        description: "runs-on для гейта (по умолчанию свой раннер home)"
        type: string
        required: false
        default: home

permissions:
  contents: read   # least privilege: гейту нужен только read исходника

jobs:
  gate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # база origin/<base> нужна дифф-проверкам (hardcode-гард + ignore)

      - name: канон CI — только свои раннеры
        uses: dippstack/ci/checks/own-runner@main

      # Заголовок PR человеческим предложением (dippstack/ais#788): чип в Telegram цитирует именно его.
      # Красный: стабы продуктов слушают pull_request с types edited — правка заголовка перезапускает гейт.
      - name: заголовок PR — предложением, без типа
        if: ${{ github.event_name == 'pull_request' }}
        uses: dippstack/ci/checks/pr-title@main
        with:
          title: ${{ github.event.pull_request.title }}
          mode: error

      # Единый движок скраббера (dippstack/ci/checks/scrub-secrets) вместо инлайн-git-grep.
      # Тир code-репо = core+dsn-creds (однозначные токены + DSN-с-кредами; `password=` НЕ
      # гейтим на коде — шумно). anti-self-approval (ignore из BASE-ветки) — внутри action.
      # first-party action в своём же репо → допустим подвижный @main; консьюмеры зовут
      # рецепт по тегу v1, который двигается релизом ci.
      - name: секрет-скан (единый движок, tier=core+dsn-creds)
        uses: dippstack/ci/checks/scrub-secrets@main
        with:
          tier: core+dsn-creds
          base_ref: ${{ github.base_ref }}

      - name: ruff — синтакс-ошибки Python (E9)
        run: pipx run ruff check --select E9 --output-format=github .

      - name: shellcheck — shell-скрипты (severity error; zsh-скрипты пропускаем)
        run: |
          mapfile -t all < <(git ls-files '*.sh')
          sh=()
          for f in "${all[@]}"; do
            # shellcheck умеет только sh/bash/dash/ksh; zsh-шебанг → SC1071 (error) и
            # роняет весь гейт. zsh-скрипты линтить нечем — пропускаем их явно.
            if head -1 "$f" | grep -qE '^#!.*[[:space:]/]zsh([[:space:]]|$)'; then
              echo "skip (zsh, shellcheck не поддерживает): $f"
            else
              sh+=("$f")
            fi
          done
          if [ ${#sh[@]} -gt 0 ]; then
            if ! command -v shellcheck >/dev/null 2>&1; then
              if sudo -n true 2>/dev/null; then
                sudo apt-get update -q && sudo apt-get install -y -q shellcheck
              else
                # Часть флота (self-hosted раннер home) без sudo вообще —
                # rootless-контур сознательно (ais canon, 2026-09-08). Пин по
                # версии+sha256, тот же метод, что wt в ais/.github/workflows/sh-gate.yml.
                v=0.10.0
                url="https://github.com/koalaman/shellcheck/releases/download/v${v}/shellcheck-v${v}.linux.x86_64.tar.xz"
                sha="6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
                curl -fsSL -o /tmp/shellcheck.tar.xz "$url"
                echo "${sha}  /tmp/shellcheck.tar.xz" | sha256sum -c -
                tar -xJf /tmp/shellcheck.tar.xz -C /tmp
                mkdir -p "$HOME/.local/bin"
                install -m 755 "/tmp/shellcheck-v${v}/shellcheck" "$HOME/.local/bin/shellcheck"
                echo "$HOME/.local/bin" >> "$GITHUB_PATH"
                export PATH="$HOME/.local/bin:$PATH"
              fi
            fi
            shellcheck -S error "${sh[@]}"
          else
            echo "shell-скриптов для shellcheck нет — пропуск"
          fi

      - name: hardcode-пути (если репа имеет гард scripts/check-paths.sh)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -f scripts/check-paths.sh ] && [ -n "${BASE_REF:-}" ]; then
            bash scripts/check-paths.sh --new "origin/$BASE_REF"
          else
            echo "check-paths.sh нет или запуск не из PR — пропуск"
          fi

      - name: proof harness (если репа имеет цель make verify)
        run: |
          if [ -f Makefile ] && grep -qE '^verify:' Makefile; then
            make verify
          else
            echo "make verify нет — пропуск"
          fi
