name: ci-python
# Reusable CI-гейт флота для Python/shell репо. ЕДИНЫЙ ИСТОЧНИК — dippstack/ci.
# Зовётся тонким стабом из репы по подвижному тегу v1 (канон CI 2026-09-19):
#   jobs: { ci: { uses: dippstack/ci/.github/workflows/ci-python.yml@v1 } }
# Рецепт ставит инструменты и сканирует секреты; проверки — в infra/ci/gate.sh ci репы.
on:
  workflow_call:
    inputs:
      runner:
        description: "runs-on для гейта (по умолчанию свой раннер home)"
        type: string
        required: false
        default: home

permissions:
  contents: read   # least privilege: гейту нужен только read исходника

jobs:
  gate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # база origin/<base> нужна дифф-проверкам (hardcode-гард + ignore)



      # Единый движок скраббера (dippstack/ci/checks/scrub-secrets) вместо инлайн-git-grep.
      # Тир code-репо = core+dsn-creds (однозначные токены + DSN-с-кредами; `password=` НЕ
      # гейтим на коде — шумно). anti-self-approval (ignore из BASE-ветки) — внутри action.
      # first-party action в своём же репо → допустим подвижный @main; консьюмеры зовут
      # рецепт по тегу v1, который двигается релизом ci.
      - name: секрет-скан (единый движок, tier=core+dsn-creds)
        uses: dippstack/ci/checks/scrub-secrets@v1
        with:
          tier: core+dsn-creds
          base_ref: ${{ github.base_ref }}

      # Закреплённый shellcheck для ворот. Раннер home rootless (sudo нет), поэтому бинарь
      # по версии и sha256 кладём в ~/.local/bin; уже стоит — шаг ничего не делает.
      - name: shellcheck на раннер
        run: |
          mkdir -p "$HOME/.local/bin"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          v=0.10.0
          "$HOME/.local/bin/shellcheck" --version 2>/dev/null | grep -q "version: $v" && exit 0
          url="https://github.com/koalaman/shellcheck/releases/download/v${v}/shellcheck-v${v}.linux.x86_64.tar.xz"
          sha="6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
          curl -fsSL -o "$RUNNER_TEMP/sc.tar.xz" "$url"
          echo "${sha}  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/shellcheck-v${v}/shellcheck" "$HOME/.local/bin/shellcheck"

      # Что проверять, решает репа: infra/ci/gate.sh ci (ruff, shellcheck, hardcode-гард,
      # make verify — у каждой своё). pre-push зовёт тот же скрипт в режиме fast.
      - name: ворота репы (infra/ci/gate.sh ci)
        run: bash infra/ci/gate.sh ci
